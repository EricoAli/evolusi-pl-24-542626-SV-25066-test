name: Laravel CI/CD

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  staging:
    name: Staging
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        run: echo "Deploying application to staging..."

  production:
    name: Production
    needs: staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy step 1
        run: echo "php artisan down --retry=60"

      - name: Deploy step 2
        run: echo "git pull origin main"

      - name: Deploy step 3
        run: echo "composer install --no-dev --optimize-autoloader"

      - name: Deploy step 4
        run: echo "php artisan migrate --force"

      - name: Deploy step 5
        run: |
          echo "php artisan config:cache"
          echo "php artisan route:cache"
          echo "php artisan view:cache"

      - name: Deploy step 6
        run: echo "php artisan queue:restart"

      - name: Deploy step 7
        run: echo "php artisan up"